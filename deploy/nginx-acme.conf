# Временный конфиг на время выпуска сертификата: только ACME-челлендж.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/example.com/acme;
        default_type "text/plain";
        try_files $uri =404;
        access_log off;
    }

    location / {
        return 404;
    }
}
