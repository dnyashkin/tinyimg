# example.com — tinyimg-web (Go) за nginx-прокси.
# Статика (index.html, app.js, demo/) встроена в бинарь и отдаётся им же,
# поэтому nginx только проксирует. ACME-путь отдан nginx'у, чтобы renew
# работал без остановки сервиса.

# HTTP: ACME-челлендж + редирект на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    access_log /var/log/nginx/tinyimg-access.log;
    error_log /var/log/nginx/tinyimg-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/example.com/acme;
        default_type "text/plain";
        try_files $uri =404;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/tinyimg-access.log;
    error_log /var/log/nginx/tinyimg-error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Файлы до 100 МБ (лимит самого сервиса) + multipart-налог.
    client_max_body_size 110m;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Тело запроса не дублируем на диске nginx: сервис сам пишет
        # загрузку во временный файл (multipart-парсер).
        proxy_request_buffering off;

        # Сжатие большого PNG занимает минуты (zopfli на мелких файлах ×25).
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # /api/zip отдаётся потоком — не буферизовать в память nginx.
        proxy_buffering off;
    }
}
